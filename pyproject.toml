[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cinch-init"
version = "0.1.0"
description = "Universal agents for every harness. Author once, wire everywhere — Claude Code, Cursor, Codex, Copilot, Gemini CLI, Windsurf, Cline, OpenCode, Aider."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "00200200" }]
keywords = ["agents", "skills", "claude-code", "cursor", "codex", "copilot", "gemini", "windsurf", "cline", "opencode", "aider", "harness"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "questionary>=2.0",
  "rich>=13.7",
]

[project.urls]
Homepage = "https://github.com/00200200/cinch"
Repository = "https://github.com/00200200/cinch"

[project.scripts]
cinch = "cinch.cli:main"
cinch-init = "cinch.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cinch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=7.1.0",
  "ruff>=0.12",
]
