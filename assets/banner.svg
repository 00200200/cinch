  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <rect x="0" y="0" width="1280" height="640" fill="none" stroke="#161b22" stroke-width="2"/>

  <text x="74" y="98" font-size="19" letter-spacing="3.2" fill="#8b949e">UNIVERSAL AGENTS &#183; EVERY HARNESS</text>
  <text x="74" y="126" font-size="16" letter-spacing="2" fill="#586069">one CLI &#183; Claude Code &#183; Cursor &#183; Codex &#183; Grok &#183; OpenCode</text>

  <text x="70" y="282" font-size="128" font-weight="800" letter-spacing="-4" fill="#e6edf3">cinch</text>
  <rect x="74" y="304" width="292" height="9" rx="4" fill="url(#rg)"/>

  <text x="76" y="376" font-size="34" fill="#c9d1d9">Universal agents for every harness.</text>
  <text x="76" y="420" font-size="24" fill="#8b949e">Init once. Pick the harness. Pick its skills and agents.</text>

  <g transform="translate(980,132)">
    <rect x="0" y="36" width="196" height="36" rx="10" fill="url(#strap)"/>
    <rect x="148" y="18" width="52" height="72" rx="10" fill="#c9d1d9"/>
    <rect x="158" y="28" width="32" height="52" rx="6" fill="#0b0f14"/>
    <rect x="168" y="40" width="12" height="28" rx="3" fill="#2ee6d6"/>
    <text x="98" y="132" font-size="18" font-weight="700" text-anchor="middle" fill="#8b949e">strap in</text>
  </g>

  <rect x="72" y="486" width="1136" height="106" rx="15" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <text x="102" y="532" font-size="23"><tspan fill="#8b949e">init&#160;&#160;</tspan><tspan fill="#2ee6d6">cinch init</tspan><tspan fill="#586069">  &#8594;  harness  &#8594;  its skills / agents / hooks</tspan></text>
  <text x="102" y="568" font-size="23"><tspan fill="#8b949e">wired&#160;</tspan><tspan fill="#c9d1d9">Claude Code &#183; Cursor &#183; Codex &#183; Grok &#183; OpenCode</tspan></text>

  <text x="1208" y="624" text-anchor="end" font-size="17" fill="#586069">MIT &#183; no telemetry</text>
