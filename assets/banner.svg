<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="cinch — Universal agents for every harness. Init once. Pick Claude Code, Cursor, Codex, Grok, or OpenCode, then pick its skills and agents.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1016"/><stop offset="1" stop-color="#05070a"/>
    </linearGradient>
    <linearGradient id="rg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ee6d6"/><stop offset="0.55" stop-color="#4c8dff"/><stop offset="1" stop-color="#a371f7"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="28%" r="58%">
      <stop offset="0" stop-color="#2ee6d6" stop-opacity="0.18"/><stop offset="1" stop-color="#2ee6d6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="strap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2ee6d6"/><stop offset="1" stop-color="#4c8dff"/>
    </linearGradient>
    <style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style>
