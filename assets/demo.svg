<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" width="860" height="560" font-size="15" role="img" aria-label="Real cinch CLI: list harnesses, list Claude Code inventory, attach humanizer and reviewer">
  <style>
    text{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;fill:#c9d1d9}
    .dim{fill:#8b949e}.g{fill:#3fb950}.c{fill:#2ee6d6}.b{fill:#58a6ff}.m{fill:#a371f7}
    #l1,#l2,#l3,#l4,#l5,#l6,#l7,#l8,#l9,#l10,#l11,#l12,#l13,#l14,#l15{opacity:0;animation:hold 16s infinite}
    #l1{animation-name:r1}#l2{animation-name:r2}#l3{animation-name:r3}#l4{animation-name:r4}
    #l5{animation-name:r5}#l6{animation-name:r6}#l7{animation-name:r7}#l8{animation-name:r8}
    #l9{animation-name:r9}#l10{animation-name:r10}#l11{animation-name:r11}#l12{animation-name:r12}
    #l13{animation-name:r13}#l14{animation-name:r14}#l15{animation-name:r15}
    @keyframes r1{0%,2%{opacity:0}4%,94%{opacity:1}100%{opacity:0}}
    @keyframes r2{0%,8%{opacity:0}10%,94%{opacity:1}100%{opacity:0}}
    @keyframes r3{0%,14%{opacity:0}16%,94%{opacity:1}100%{opacity:0}}
    @keyframes r4{0%,20%{opacity:0}22%,94%{opacity:1}100%{opacity:0}}
    @keyframes r5{0%,26%{opacity:0}28%,94%{opacity:1}100%{opacity:0}}
    @keyframes r6{0%,32%{opacity:0}34%,94%{opacity:1}100%{opacity:0}}
    @keyframes r7{0%,38%{opacity:0}40%,94%{opacity:1}100%{opacity:0}}
    @keyframes r8{0%,44%{opacity:0}46%,94%{opacity:1}100%{opacity:0}}
    @keyframes r9{0%,50%{opacity:0}52%,94%{opacity:1}100%{opacity:0}}
    @keyframes r10{0%,56%{opacity:0}58%,94%{opacity:1}100%{opacity:0}}
    @keyframes r11{0%,62%{opacity:0}64%,94%{opacity:1}100%{opacity:0}}
    @keyframes r12{0%,68%{opacity:0}70%,94%{opacity:1}100%{opacity:0}}
    @keyframes r13{0%,74%{opacity:0}76%,94%{opacity:1}100%{opacity:0}}
    @keyframes r14{0%,80%{opacity:0}82%,94%{opacity:1}100%{opacity:0}}
    @keyframes r15{0%,86%{opacity:0}88%,94%{opacity:1}100%{opacity:0}}
    .cur{animation:blink 1.1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
  </style>
  <rect x="6" y="6" width="848" height="548" rx="10" fill="#0d1117" stroke="#30363d"/>
  <rect x="6" y="6" width="848" height="36" rx="10" fill="#161b22"/>
  <rect x="6" y="30" width="848" height="12" fill="#161b22"/>
  <circle cx="28" cy="24" r="6" fill="#ff5f56"/>
  <circle cx="48" cy="24" r="6" fill="#ffbd2e"/>
  <circle cx="68" cy="24" r="6" fill="#27c93f"/>
  <text x="430" y="29" text-anchor="middle" class="dim">cinch · recorded stdout</text>

  <text id="l1" x="26" y="72"><tspan class="dim">$</tspan> <tspan class="c">cinch harnesses</tspan></text>
  <text id="l2" x="26" y="100" class="c">cinch  Universal agents for every harness.</text>
  <text id="l3" x="26" y="128"><tspan class="g">claude</tspan>  Claude Code   on disk</text>
  <text id="l4" x="26" y="152"><tspan class="b">cursor</tspan>  Cursor        on disk</text>
  <text id="l5" x="26" y="176"><tspan class="m">codex</tspan>   Codex          on disk     <tspan class="dim">grok · opencode · &</tspan></text>

  <text id="l6" x="26" y="216"><tspan class="dim">$</tspan> <tspan class="c">cinch inventory --harness claude</tspan></text>
  <text id="l7" x="26" y="244" class="dim">kind      name</text>
  <text id="l8" x="26" y="268">skill     humanizer</text>
  <text id="l9" x="26" y="292">agent     reviewer</text>
  <text id="l10" x="26" y="316">hook      format.sh     <tspan class="dim">command ship</tspan></text>

  <text id="l11" x="26" y="356"><tspan class="dim">$</tspan> <tspan class="c">cinch init --harness claude --skills humanizer --agents reviewer --yes</tspan></text>
  <text id="l12" x="26" y="384" class="c">cinch  Universal agents for every harness.</text>
  <text id="l13" x="26" y="412">  harness   Claude Code (claude)</text>
  <text id="l14" x="26" y="436">  attached  skill:humanizer, agent:reviewer</text>
  <text id="l15" x="26" y="460">  project   /private/tmp/cinch-app</text>

  <text x="26" y="512"><tspan class="dim">$</tspan> <tspan class="cur">Œ</tspan></text>
</svg>
