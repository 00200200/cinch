<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 580" width="860" height="580" font-size="15" role="img" aria-label="Real cinch CLI: list harnesses, list Claude Code inventory, attach humanizer and reviewer">
  <style>
    text{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;fill:#c9d1d9}
    .dim{fill:#8b949e}.g{fill:#3fb950}.c{fill:#2ee6d6}.b{fill:#58a6ff}.m{fill:#a371f7}
    #l1,#l2,#l3,#l4,#l5,#l6,#l7,#l8,#l9,#l10,#l11,#l12,#l13,#l14,#l15,#l16{opacity:0;animation:hold 16s infinite}
    #l1{animation-name:r1}#l2{animation-name:r2}#l3{animation-name:r3}#l4{animation-name:r4}
    #l5{animation-name:r5}#l6{animation-name:r6}#l7{animation-name:r7}#l8{animation-name:r8}
    #l9{animation-name:r9}#l10{animation-name:r10}#l11{animation-name:r11}#l12{animation-name:r12}
    #l13{animation-name:r13}#l14{animation-name:r14}#l15{animation-name:r15}#l16{animation-name:r16}
    @keyframes r1{0%,2%{opacity:0}4%,94%{opacity:1}100%{opacity:0}}
    @keyframes r2{0%,7%{opacity:0}9%,94%{opacity:1}100%{opacity:0}}
    @keyframes r3{0%,12%{opacity:0}14%,94%{opacity:1}100%{opacity:0}}
    @keyframes r4{0%,17%{opacity:0}19%,94%{opacity:1}100%{opacity:0}}
    @keyframes r5{0%,22%{opacity:0}24%,94%{opacity:1}100%{opacity:0}}
    @keyframes r6{0%,27%{opacity:0}29%,94%{opacity:1}100%{opacity:0}}
    @keyframes r7{0%,32%{opacity:0}34%,94%{opacity:1}100%{opacity:0}}
    @keyframes r8{0%,37%{opacity:0}39%,94%{opacity:1}100%{opacity:0}}
    @keyframes r9{0%,42%{opacity:0}44%,94%{opacity:1}100%{opacity:0}}
    @keyframes r10{0%,47%{opacity:0}49%,94%{opacity:1}100%{opacity:0}}
    @keyframes r11{0%,52%{opacity:0}54%,94%{opacity:1}100%{opacity:0}}
    @keyframes r12{0%,57%{opacity:0}59%,94%{opacity:1}100%{opacity:0}}
    @keyframes r13{0%,62%{opacity:0}64%,94%{opacity:1}100%{opacity:0}}
    @keyframes r14{0%,67%{opacity:0}69%,94%{opacity:1}100%{opacity:0}}
    @keyframes r15{0%,72%{opacity:0}74%,94%{opacity:1}100%{opacity:0}}
    @keyframes r16{0%,77%{opacity:0}79%,94%{opacity:1}100%{opacity:0}}
    .cur{animation:blink 1.1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
  </style>
  <rect x="6" y="6" width="848" height="568" rx="10" fill="#0d1117" stroke="#30363d"/>
  <rect x="6" y="6" width="848" height="36" rx="10" fill="#161b22"/>
  <rect x="6" y="30" width="848" height="12" fill="#161b22"/>
  <circle cx="28" cy="24" r="6" fill="#ff5f56"/>
  <circle cx="48" cy="24" r="6" fill="#ffbd2e"/>
  <circle cx="68" cy="24" r="6" fill="#27c93f"/>
  <text x="430" y="29" text-anchor="middle" class="dim">cinch &#183; recorded stdout</text>

  <text id="l1" x="26" y="72"><tspan class="dim">$</tspan> <tspan class="c">cinch harnesses</tspan></text>
  <text id="l2" x="26" y="100" class="c">cinch  Universal agents for every harness.</text>
  <text id="l3" x="26" y="124" class="dim">id          harness           this machine</text>
  <text id="l4" x="26" y="148"><tspan class="g">claude</tspan>      Claude Code       on disk</text>
  <text id="l5" x="26" y="172"><tspan class="b">cursor</tspan>      Cursor            on disk</text>
  <text id="l6" x="26" y="196"><tspan class="m">codex</tspan>       Codex             on disk</text>

  <text id="l7" x="26" y="236"><tspan class="dim">$</tspan> <tspan class="c">cinch inventory --harness claude</tspan></text>
  <text id="l8" x="26" y="264" class="c">cinch  Claude Code</text>
  <text id="l9" x="26" y="288" class="dim">kind      name</text>
  <text id="l10" x="26" y="312">agent     reviewer</text>
  <text id="l11" x="26" y="336">command   ship</text>
  <text id="l12" x="26" y="360">hook      format.sh</text>
  <text id="l13" x="26" y="384">skill     humanizer</text>

  <text id="l14" x="26" y="424"><tspan class="dim">$</tspan> <tspan class="c">cinch init --harness claude --skills humanizer --agents reviewer --yes</tspan></text>
  <text id="l15" x="26" y="452" class="c">cinch  Universal agents for every harness.</text>
  <text id="l16" x="26" y="476">  attached  skill:humanizer, agent:reviewer</text>

  <text x="26" y="528"><tspan class="dim">$</tspan> <tspan class="cur">&#9608;</tspan></text>
</svg>
